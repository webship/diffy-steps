name: Test

on:
  push:
    branches: ['2.0.x']
  pull_request:
    branches: ['2.0.x']
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'

jobs:
  # The mock lane: needs no Diffy account.
  cucumber:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run cucumber dry-run (no ambiguous/undefined steps)
        run: npm run test:dry

      - name: Check the docblock examples and the features against the steps
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Check the step documentation is up to date
        run: npm run docs:check

      - name: Check the mock Diffy API against the documented contract
        run: npm run test:unit

      - name: Run the features against the mock Diffy API
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            tests/reports/
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore

  # The live lane: the same features against the real Diffy API. It runs on
  # pushes and manual runs, never on pull requests, and without the secrets it
  # prints why it skipped and ends green.
  live:
    if: github.event_name != 'pull_request'
    # One live run at a time: they all drive the one Diffy project of the
    # repository's secrets. A newer push waits for the running one.
    concurrency:
      group: ${{ github.workflow }}-live
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DIFFY_API_KEY: ${{ secrets.DIFFY_API_KEY }}
      DIFFY_PROJECT_ID: ${{ vars.DIFFY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the features against the real Diffy API
        run: npm run test:live
