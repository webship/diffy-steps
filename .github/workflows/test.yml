name: Test

on:
  push:
    branches: ['2.0.x']
  pull_request:
    branches: ['2.0.x']
  workflow_dispatch:

env:
  FORCE_COLOR: '1'

jobs:
  # The mock lane: needs no Diffy account.
  cucumber:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run cucumber dry-run (no ambiguous/undefined steps)
        run: npm run test:dry

      - name: Check the mock Diffy API against the documented contract
        run: npm run test:unit

      - name: Run the features against the mock Diffy API
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            tests/reports/cucumber_report.json
            screenshots/
          retention-days: 14

  # The live lane: the same features against the real Diffy API. It runs on
  # pushes and manual runs, never on pull requests, and without the secrets it
  # prints why it skipped and ends green.
  live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DIFFY_API_KEY: ${{ secrets.DIFFY_API_KEY }}
      DIFFY_PROJECT_ID: ${{ vars.DIFFY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the features against the real Diffy API
        run: npm run test:live
