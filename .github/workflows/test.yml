name: Test

on:
  push:
    branches: ['1.0.x']
  pull_request:
    branches: ['1.0.x']
  workflow_dispatch:

env:
  FORCE_COLOR: '1'

jobs:
  cucumber:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Serve the example pages
        run: npm start &

      - name: Wait for the example server
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/diffy/baseline.html || true)
            [ "$code" = "200" ] && exit 0
            sleep 1
          done
          echo "Example server did not become ready in time" >&2
          exit 1

      - name: Run cucumber dry-run (no ambiguous/undefined steps)
        run: npm run test:dry

      - name: Run Diffy step tests against the mock Diffy API
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            tests/reports/cucumber_report.json
            screenshots/
          retention-days: 14
